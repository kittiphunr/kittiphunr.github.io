# Nginx server block for the portfolio (static files only).
# setup-server.sh replaces __DOMAIN__ and __ROOT__, then certbot adds HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Pages and content data: always revalidate so edits show at once.
    location ~* \.(html|json|xml|txt)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # CSS/JS links carry ?v=<hash>, so a long cache is safe; images change rarely.
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never serve dotfiles (the .htaccess files are for Apache and not uploaded anyway).
    location ~ /\. { deny all; }
}
