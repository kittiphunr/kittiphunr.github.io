# Auto-translate portfolio content, then deploy the static site to GitHub Pages.
name: Translate and deploy to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# contents: write lets the workflow commit the filled-in translations back to the repo.
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fill in missing translations (TH / EN / JA / ZH)
        run: node scripts/translate.mjs site/data/portfolio.json

      - name: Commit translations
        run: |
          if git diff --quiet -- site/data/; then
            echo "No new translations."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add site/data/
            git commit -m "chore: auto-translate portfolio content [skip ci]"
            git push || echo "Could not push translations; the deployed site still includes them."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the site/ folder; scripts, workflows and docs stay out.
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
