# Checks that run on every pull request, before anything reaches main.
# Nothing is deployed from here.
name: Check site

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Check data, links, sitemap and JavaScript
        run: python3 scripts/check_site.py

      - name: Build the host copy (deploy/)
        run: python3 scripts/build_deploy.py --no-zip
