    <p class="mt-2">นักวิชาการคอมพิวเตอร์ มหาวิทยาลัยมหาจุฬาลงกรณราชวิทยาลัย วิทยาเขตแพร่ — Computer Technical Officer, Mahachulalongkornrajavidyalaya University, Phrae Campus (since 1 October 2024).</p>
    <p class="mt-2">ความเชี่ยวชาญ: ระบบเครือข่ายองค์กร (Cisco), Windows Server, Linux Server &amp; CLI, Full-Stack Development.</p>
    <p class="mt-2">ผลงานเด่น: Precision QC — ระบบตรวจสอบคุณภาพเชื้อราด้วยการวิเคราะห์ภาพ (Python + NumPy/Pillow) ที่รันในเบราว์เซอร์ด้วย JavaScript + Pyodide (WebAssembly) — <a class="text-accent" href="https://kittiphun.rut.mcupr.ac.th/projects/precision-qc-web/">ทดลองใช้งานจริง</a></p>
    <p class="mt-2">ผลงานเด่น: Smart IV Alert (IV-Monitor-BCNPH) — ระบบ IoT ตรวจวัดและแจ้งเตือนการให้สารน้ำทางหลอดเลือดดำ เฟิร์มแวร์ C++ บน ESP32-S3 สื่อสารด้วย ESP-NOW และออกแบบวงจรด้วย KiCad — <a class="text-accent" href="https://github.com/kittiphunr/IV-Monitor-BCNPH">ซอร์สโค้ดบน GitHub</a></p>
    <p class="mt-2">ผลงาน: TOR-MCU-Standard, BOQ-MCU, Precision-QC, MCUPR-CANTEEN, IV-Monitor-BCNPH, Music Player ESP32-S3.</p>
    <p class="mt-2">ประสบการณ์ก่อนหน้า: Freelance Full-Stack Developer (2562–2566) · หัวหน้าฝ่ายงานซ่อมบำรุงเครื่องจักร บริษัท ไทยอันเป่า ผลิตภัณฑ์กระดาษ จำกัด · หัวหน้าห้องทดสอบทางไฟฟ้า ส่วนงานวิจัยและพัฒนา บริษัท สยามคอมเพรสเซอร์ อุตสาหกรรม จำกัด</p>
