<script>
  (function () {
    var root = document.documentElement, el = document.getElementById("loader");
    var start = Date.now(), MIN = 900, MAX = 6000, ready = false, loaded = false, done = false;
    root.classList.add("is-loading");
    function hide() {
      if (done) return;
      done = true;
      var still = root.dataset.motion === "off";
      setTimeout(function () {
        el.classList.add("is-done");
        // Let the hero's entrance animation start as the loader fades.
        setTimeout(function () { root.classList.remove("is-loading"); }, still ? 0 : 250);
        setTimeout(function () { el.remove(); }, still ? 0 : 1000);
      }, still ? 0 : Math.max(0, MIN - (Date.now() - start)));
    }
    function check() { if (ready && loaded) hide(); }
    document.addEventListener("pageready", function () { ready = true; check(); }, { once: true });
    window.addEventListener("load", function () { loaded = true; check(); }, { once: true });
    setTimeout(hide, MAX); // never keep the page hidden if something fails
  })();
</script>
